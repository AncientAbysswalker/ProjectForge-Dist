<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Quest - Feedback</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: rgba(31, 31, 31, 0.98);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      color: #fff;
      position: relative;
    }

    .form-content {
      transition: opacity 0.3s ease;
    }

    .form-content.hidden {
      opacity: 0;
      pointer-events: none;
      position: absolute;
    }

    h2 {
      color: #4ecca3;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .intro-text {
      color: #ccc;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #4ecca3;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(78, 204, 163, 0.3);
      border-radius: 8px;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #4ecca3;
    }

    .form-submit {
      width: 100%;
      padding: 14px;
      background: #4ecca3;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
      font-size: 16px;
    }

    .form-submit:hover {
      background: #3db88a;
      transform: translateY(-2px);
    }

    .form-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: translateY(0);
    }

    /* Success State */
    .success-content {
      text-align: center;
      display: none;
    }

    .success-content.show {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    .checkmark-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #4ecca3;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: scaleIn 0.5s ease;
    }

    .checkmark {
      width: 50px;
      height: 50px;
      stroke: #000;
      stroke-width: 3;
      fill: none;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawCheck 0.8s ease 0.3s forwards;
    }

    .success-title {
      color: #4ecca3;
      font-size: 32px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .success-message {
      color: #ccc;
      font-size: 16px;
      line-height: 1.6;
    }

    @keyframes scaleIn {
      from {
        transform: scale(0);
      }
      to {
        transform: scale(1);
      }
    }

    @keyframes drawCheck {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Hidden iframe for form submission */
    iframe {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-content" id="formContent">
      <h2>Share your Feedback</h2>
      <p class="intro-text">We'd love to hear your thoughts on SMS Quest.</p>
      
      <form id="feedbackForm">
        <div class="form-group">
          <label for="playerName">Your Name</label>
          <input type="text" id="playerName" name="name" required placeholder="Enter your name">
        </div>
        
        <div class="form-group">
          <label for="playerComment">Comments & Feedback</label>
          <textarea id="playerComment" name="comment" required placeholder="Share your thoughts about the experience..."></textarea>
        </div>
        
        <button type="submit" class="form-submit" id="submitBtn">Submit Feedback</button>
      </form>
    </div>

    <div class="success-content" id="successContent">
      <div class="checkmark-circle">
        <svg class="checkmark" viewBox="0 0 52 52">
          <path d="M14 27l8 8 16-16"/>
        </svg>
      </div>
      <h2 class="success-title">Thank You!</h2>
      <p class="success-message">Your feedback has been submitted successfully. We appreciate you taking the time to share your experience with SMS Quest!</p>
    </div>
  </div>

  <!-- Hidden iframe for form submission -->
  <iframe name="hidden_iframe"></iframe>

  <script>
    const form = document.getElementById('feedbackForm');
    const formContent = document.getElementById('formContent');
    const successContent = document.getElementById('successContent');
    const submitButton = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      submitButton.disabled = true;
      submitButton.textContent = 'Submitting...';
      
      const name = document.getElementById('playerName').value;
      const comment = document.getElementById('playerComment').value;
      const timestamp = new Date().toISOString();
      
      // Create a hidden form for Google Apps Script submission
      const hiddenForm = document.createElement('form');
      hiddenForm.method = 'POST';
      hiddenForm.action = 'https://script.google.com/macros/s/AKfycbx0LN0vH7vLSLFX_HEXj8_RonbxiSs9xpGprO7NspCMcgLuAC2n1GZ3OuNTktLx6w5I/exec';
      hiddenForm.style.display = 'none';
      hiddenForm.target = 'hidden_iframe';

      // Add form fields
      const fields = { timestamp, name, comment };
      for (const key in fields) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = fields[key];
        hiddenForm.appendChild(input);
      }

      // Submit the hidden form
      document.body.appendChild(hiddenForm);
      hiddenForm.submit();

      // Show success state after a brief delay
      setTimeout(() => {
        formContent.classList.add('hidden');
        
        setTimeout(() => {
          successContent.classList.add('show');
        }, 300);
      }, 500);
    });
  </script>
</body>
</html>
