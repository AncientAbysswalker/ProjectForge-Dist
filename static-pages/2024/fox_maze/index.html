<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>In the Dark</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <div id="game-container">
        <div id="instructions">
            <h3>Controls</h3>
            <p id="desktop-controls-info">Use WASD keys to move. Click and drag on the viewport to pan the view.</p>
            <p id="mobile-controls-info">Use the control pad provided to move. Drag on the viewport to pan the view.</p>
            <h3>Playing the Game</h3>
            <p>Collect colored keys to open matching chests to expand your view. You will need to find the Fox first though!</p>
        </div>

        <div id="canvas-wrapper">
            <canvas tabindex="0" id="canvas" width="160" height="160"></canvas>
        </div>

        <div id="mobile-controls">
            <div class="control-section">
                <div class="dpad">
                    <div class="dpad-button empty"></div>
                    <div class="dpad-button" id="btn-up">↑</div>
                    <div class="dpad-button empty"></div>
                    <div class="dpad-button" id="btn-left">←</div>
                    <div class="dpad-button empty"></div>
                    <div class="dpad-button" id="btn-right">→</div>
                    <div class="dpad-button empty"></div>
                    <div class="dpad-button" id="btn-down">↓</div>
                    <div class="dpad-button empty"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Controls Script - runs before game script -->
    <script src="./script.js"></script>

    <!-- Your existing game script -->
    <script type="module" src="./game.js"></script>
</body>
</html>
